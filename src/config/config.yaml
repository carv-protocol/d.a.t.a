character:
  # Path to character configuration file
  path: "./src/config/character_data_agent.json"
  name: "Love Oracle"

database:
  # Database type: "sqlite" or "postgres"
  type: "sqlite"
  # Database path (for SQLite) or connection string (for Postgres)
  path: "./data/agent.db"

llm_config:
  # LLM provider: "openai", "deepseek", etc.
  provider: "openai"
  # API key for the LLM provider
  api_key: ""
  # Base URL for API calls
  base_url: "https://api.deepseek.com"
  # Model name
  model: "deepseek-chat"

data:
  carvid:
    # CarvID API endpoint
    url: "https://api.carv.io/v1"
    # API key for CarvID
    api_key: "your-carvid-api-key-here"


token:
  network: "base"
  ticker: "carv"
  contract_addr: "0xc08cd26474722ce93f4d0c34d16201461c10aa8c"

governance:
  # Default admin configuration (used as fallback)
  admin_ids: []
  min_token_balance: 0
  # Platform-specific configurations
  discord:
    admin_ids: []
    min_token_balance: 1000
  twitter:
    admin_ids: []
    min_token_balance: 1000
  telegram:
    admin_ids: []
    min_token_balance: 1000

social:
  twitter:
    mode: ""
    username: ""
    password: ""
    api_key: ""
    api_key_secret: ""
    access_token: ""
    token_secret: ""
    monitor_window: 0
  discord:
    api_token: ""
  telegram:
    bot_token: ""
    channel_id: 0
    debug: false

web:
  port: 8000

plugins:
  data:
    name: "d.a.t.a"
    enabled: true
    version: "1.0.0"
    author: "CARV Protocol"
    description: "Core data interaction plugin for Ethereum blockchain analysis"
    dependencies: []
    options:
      api_url: "your-api-url-here"
      auth_token: "your-auth-token-here"
      chain: "ethereum-mainnet"
      llm:
        model: "deepseek-chat"
        max_tokens: 2000
        temperature: 0.7

  wallet:
    name: "evm-wallet"
    enabled: false
    version: "1.0.0"
    author: "CARV Protocol"
    description: "Wallet plugin for EVM blockchain"
    dependencies: []
    options:
      # Private key for the wallet
      private_key: "your-private-key-here"
      # Network: "base" or "ethereum"
      network: "base-mainnet"
      # RPC URL
      rpc_url: "https://base.llamarpc.com"
      chain_id: 8453
      timeout: 30s

  governance:
    name: "d.a.t.a-governance"
    enabled: true
    version: "1.0.0"
    author: "CARV Protocol"
    description: "Governance plugin for managing proposals and voting"
    dependencies: []
    options:
      min_token_balance: 0
      proposal_duration: 604800  # 7 days in seconds
      llm:
        model: "deepseek-chat"
        max_tokens: 2000
        temperature: 0.7      